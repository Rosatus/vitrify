[project]
name = "glass"
version = "0.1.0"
description = "Bake a Nebula-style wallpaper into one image for any terminal"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
glass = "glass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glass"]
